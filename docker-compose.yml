version: '3.8'
services:
  hr-backend:
    build: .
    container_name: hr-system-backend
    ports:
      - "5000:5000"
    volumes:
      - hr-data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/WeatherForecast"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  hr-data:
    driver: local
