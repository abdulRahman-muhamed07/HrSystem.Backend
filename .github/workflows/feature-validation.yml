name: Feature Validation

on:
  push:
    branches: [ "feature/production-upgrades" ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore HrSystem.Backend.slnx
      - name: Build
        run: dotnet build HrSystem.Backend.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test HrSystem.Backend.slnx --configuration Release --no-build --verbosity normal
      - name: Verify migrations exist
        shell: bash
        run: |
          test -d src/HrSystem.Infrastructure/Migrations
          test "$(find src/HrSystem.Infrastructure/Migrations -maxdepth 1 -type f -name '*.cs' | wc -l)" -ge 2
