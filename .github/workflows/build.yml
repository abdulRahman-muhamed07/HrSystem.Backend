name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore HrSystem.Backend.slnx
      - name: Build
        run: dotnet build HrSystem.Backend.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test HrSystem.Backend.slnx --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
